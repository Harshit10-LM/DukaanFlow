services:
  - type: web
    name: dukaanflow-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: dukaanflow
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      # eleven_multilingual_v2: 29 languages incl. English+Hindi, up to 10k chars
      # eleven_v3: 70+ languages, up to 5k chars (override in Render dashboard if preferred)
      - key: ELEVENLABS_MODEL_ID
        value: eleven_multilingual_v2
